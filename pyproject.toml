[project]
name = "ragasearch"
version = "0.2.0"
description = "Identify the raga of Hindustani classical music from audio"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731"]  # small lambdas are fine in tests

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "I001"]  # scripts import _path before the package

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
